<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">ResolveAI architecture</title><desc id="desc">Next.js and FastAPI feed a durable LangGraph workflow. Provider interpretation passes through deterministic policy and approval controls before simulated permission mutation and independent verification. PostgreSQL stores evidence and checkpoints; pgvector ranks policy evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527788"/></marker></defs><rect width="1200" height="1080" rx="22" fill="#f5f7f8"/><g font-family="Arial, sans-serif"><text x="600" y="48" text-anchor="middle" font-size="30" fill="#10283f" font-weight="bold">ResolveAI / controlled access workflow</text><text x="600" y="79" text-anchor="middle" font-size="20" fill="#087f77" font-weight="normal">Interpretation is a proposal. Authorization is deterministic.</text><rect x="50" y="115" width="230" height="78" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="165.0" y="146" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Employee</text><text x="165.0" y="171" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Repository-access request</text><rect x="335" y="115" width="230" height="78" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="450.0" y="146" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Next.js UI</text><text x="450.0" y="171" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Workspace / approvals</text><rect x="620" y="115" width="230" height="78" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="735.0" y="146" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">FastAPI</text><text x="735.0" y="171" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Typed API contracts</text><rect x="905" y="115" width="245" height="78" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="1027.5" y="146" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Domain services</text><text x="1027.5" y="171" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Transactions / scope</text><path d="M 280 154 L 333 154" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 565 154 L 618 154" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 850 154 L 903 154" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 1027 193 L 1027 240" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1027 240 L600 240 L600 267" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="360" y="270" width="480" height="80" rx="12" fill="#e3f0ed" stroke="#087f77" stroke-width="2"/><text x="600.0" y="301" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Durable LangGraph workflow</text><text x="600.0" y="326" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Queue / leases / checkpoints / interrupt-resume</text><rect x="50" y="270" width="260" height="80" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="180.0" y="301" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Structured provider</text><text x="180.0" y="326" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Demo parser or OpenAI adapter</text><path d="M 310 310 L 358 310" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 350 L600 387 L210 387 L210 417" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 350 L600 387 L600 387 L600 417" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600 350 L600 387 L990 387 L990 417" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="420" width="320" height="80" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="210.0" y="451" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Policy-grounded RAG</text><text x="210.0" y="476" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Reviewed corpus / evidence fingerprints</text><rect x="440" y="420" width="320" height="80" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="600.0" y="451" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Human approval</text><text x="600.0" y="476" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Persist decision / forbid self-approval</text><rect x="830" y="420" width="320" height="80" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="990.0" y="451" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Typed tools</text><text x="990.0" y="476" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Arguments / run scope / lease guards</text><path d="M 210 500 L 210 552" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 600 500 L 600 552" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 990 500 L 990 552" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="555" width="1100" height="94" rx="12" fill="#e3f0ed" stroke="#087f77" stroke-width="2"/><text x="600.0" y="586" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Deterministic authorization boundary</text><text x="600.0" y="611" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Current identity + resource + permission + reviewed policy + eligible scoped approval</text><text x="600" y="631" text-anchor="middle" font-size="16" fill="#087f77" font-weight="normal">Model output and retrieved prose cannot directly authorize a grant.</text><path d="M 600 649 L 600 686" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="690" width="320" height="80" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="210.0" y="721" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Simulated permission effect</text><text x="210.0" y="746" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Idempotent action + result transaction</text><rect x="440" y="690" width="320" height="80" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="600.0" y="721" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Independent readback</text><text x="600.0" y="746" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Observe actual stored permission</text><rect x="830" y="690" width="320" height="80" rx="12" fill="#ffffff" stroke="#c7d6dd" stroke-width="2"/><text x="990.0" y="721" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Resolve / escalate</text><text x="990.0" y="746" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Closure requires verification evidence</text><path d="M600 670 L210 670 L210 688" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 370 730 L 438 730" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 760 730 L 828 730" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="840" width="710" height="95" rx="12" fill="#e3f0ed" stroke="#087f77" stroke-width="2"/><text x="405.0" y="871" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">PostgreSQL + pgvector</text><text x="405.0" y="896" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Tickets / runs / approvals / tools / policies / checkpoints / evaluations</text><rect x="830" y="840" width="320" height="95" rx="12" fill="#e3f0ed" stroke="#087f77" stroke-width="2"/><text x="990.0" y="871" text-anchor="middle" font-size="21" fill="#10283f" font-weight="bold">Automated evaluation</text><text x="990.0" y="896" text-anchor="middle" font-size="16" fill="#576c78" font-weight="normal">Trace assertions + isolated scenarios</text><path d="M 990 770 L 990 838" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 830 886 L 762 886" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M210 770 L210 837" fill="none" stroke="#527788" stroke-width="2.5" marker-end="url(#arrow)"/><text x="600" y="987" text-anchor="middle" font-size="19" fill="#576c78" font-weight="normal">Persistence underpins domain services, retrieval, workflow recovery and audit.</text><text x="600" y="1025" text-anchor="middle" font-size="17" fill="#576c78" font-weight="normal">v0.1: simulated effects / offline baseline / one backend worker / localhost demonstration</text></g></svg>