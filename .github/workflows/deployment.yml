name: Deployment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: resolveai-ci
      APP_ENV: test
      LLM_PROVIDER: demo
      EMBEDDING_PROVIDER: local_hash
      AGENT_POLL_SECONDS: '0.1'
      LANGGRAPH_STRICT_MSGPACK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the complete application
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify the browser entry point
        run: curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/resolveai-index.html
      - name: Verify approval, execution, readback, and all evaluation scenarios
        run: python backend/scripts/smoke_deployment.py --base-url http://127.0.0.1:3000 --all-scenarios --timeout-seconds 180
      - name: Restart application processes with existing database state
        run: |
          docker compose restart backend frontend
          docker compose up --wait --wait-timeout 120
      - name: Verify persisted ticket and evaluation history
        run: |
          python - <<'PY'
          import httpx
          with httpx.Client(base_url="http://127.0.0.1:3000", timeout=10) as client:
              tickets = client.get("/api/tickets").raise_for_status().json()
              assert tickets["total"] == 1, tickets
              ticket = tickets["items"][0]
              assert ticket["status"] == "RESOLVED", ticket
              live = client.get("/api/evaluations/summary?source=live").raise_for_status().json()
              assert live["total_results"] == live["passed_results"] == 1, live
              assert live["metrics"]["task_success"] == 1, live
              scenarios = client.get("/api/evaluations/summary?source=scenario").raise_for_status().json()
              assert scenarios["total_results"] == scenarios["total_scenarios"], scenarios
              assert scenarios["passed_results"] == scenarios["total_results"], scenarios
          print("Restart preserved resolved ticket and all evaluation results.")
          PY
      - name: Capture container status and logs
        if: always()
        run: |
          mkdir -p deployment-artifacts
          docker compose ps -a > deployment-artifacts/status.txt
          docker compose logs --no-color > deployment-artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployment-failure-logs
          path: deployment-artifacts/
          retention-days: 7
      - name: Remove this CI project's disposable containers and database
        if: always()
        run: docker compose down --volumes --remove-orphans
