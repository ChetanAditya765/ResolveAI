name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resolveai_test
          POSTGRES_USER: resolveai
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolveai -d resolveai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      APP_ENV: test
      LANGGRAPH_STRICT_MSGPACK: 'true'
      TEST_DATABASE_URL: postgresql+psycopg://resolveai:test_only@localhost:5432/resolveai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m pytest
        working-directory: backend
      - run: python backend/scripts/smoke_http.py --agent
